manifest_version: 2
name: telegram
version: 1.0.0
description: Telegram notifications and task capture for Datacore
author: gregor
license: MIT

provides:
  tools:
    - name: send_notification
      description: Send a notification message to Telegram
      handler: tools/send_notification.py
    - name: capture_from_bot
      description: Capture incoming bot messages to inbox.org
      handler: tools/capture_from_bot.py

  agents:
    - name: telegram-capture
      trigger: ":telegram:"

  commands:
    - telegram-setup
    - telegram-test

triggers:
  - "telegram"
  - "notify"
  - "message me"
context: on_match
